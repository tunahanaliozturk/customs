name: corpus

# Scans the benign corpus, the 300 most downloaded packages pinned in
# corpus/benign.txt, and checks the result against the reviewed list in
# corpus/benign-expected.txt. Weekly, and by hand.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Restored and saved separately, so that a failing scan does not make
      # next week's run download 849 MB again.
      - id: corpus-cache
        uses: actions/cache/restore@v4
        with:
          path: target/corpus
          key: corpus-${{ hashFiles('corpus/benign.txt') }}
      - run: python3 -I corpus/corpus.py fetch
      - if: always() && steps.corpus-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/corpus
          key: corpus-${{ hashFiles('corpus/benign.txt') }}
      # The reviewed findings, and the metadata reader against the oracle.
      - run: cargo test --release -- --ignored corpus
