# cargo-deny: licence and advisory gate. CI fails on anything not listed here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
]

# MIT-0 only for borrow-or-share, through the test-only jsonschema that
# checks SARIF output against its schema. constant_time_eq, also MIT-0, is
# offered under Apache-2.0 too.
[[licenses.exceptions]]
crate = "borrow-or-share"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
